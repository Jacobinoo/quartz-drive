name: Build and Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run Go Tests
        run: go test -v ./...
        working-directory: ./server

  build:
    name: Build & Push ARM64 Container
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Use native ARM64 hosted runner to build Ampere images fast without QEMU emulation
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push quartz-server image
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quartz-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quartz-server:${{ github.sha }}
          build-args: |
            BUILD_VERSION=sha-${{ github.sha }}-build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Kubernetes Rolling Update
    needs: build
    # Deploy only runs on push/dispatch to master, never on PRs/forks
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, k3s]
    steps:
      - name: Roll out and verify
        env:
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
          DEPLOY_ALERT_ON_SUCCESS: ${{ vars.DEPLOY_ALERT_ON_SUCCESS }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ secrets.DOCKERHUB_USERNAME }}/quartz-server:${{ github.sha }}
        run: |
          send_discord_alert() {
            local title="$1"
            local status="$2"
            local logs="$3"

            if [ -z "$DEPLOY_ALERT_WEBHOOK" ]; then
              echo "DEPLOY_ALERT_WEBHOOK secret is not set or empty; skipping Discord alert."
              return 0
            fi

            # Discord message limit is 2000 characters. Keep status <= 400, logs <= 1200.
            local payload=""
            if command -v python3 >/dev/null 2>&1; then
              payload=$(python3 -c '
import sys, json
title, status, logs = sys.argv[1], sys.argv[2][:400], sys.argv[3][:1200]
msg = f"{title}\n```\n{status}\n```\n**Last Container Logs:**\n```\n{logs}\n```"
print(json.dumps({"content": msg}))
' "$title" "$status" "$logs")
            elif command -v jq >/dev/null 2>&1; then
              payload=$(jq -n \
                --arg title "$title" \
                --arg status "$(echo "$status" | head -c 400)" \
                --arg logs "$(echo "$logs" | tail -c 1200)" \
                '{content: ($title + "\n```\n" + $status + "\n```\n**Last Container Logs:**\n```\n" + $logs + "\n```")}')
            else
              echo "::warning::Neither python3 nor jq is available on this runner to format JSON alert."
              return 1
            fi

            # Send to Discord and inspect HTTP response status
            local response
            response=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" -X POST -d "$payload" "$DEPLOY_ALERT_WEBHOOK")
            local http_code
            http_code=$(echo "$response" | tail -n 1)
            local body
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Discord alert sent successfully (HTTP $http_code)."
            else
              echo "::warning::Failed to send Discord alert (HTTP $http_code): $body"
            fi
          }

          echo "Deploying image: $IMAGE_TAG"
          kubectl -n default set image deployment/quartz-api quartz-api="$IMAGE_TAG"

          if ! kubectl -n default rollout status deployment/quartz-api --timeout=180s; then
            echo "::error::Rollout failed or timed out! Collecting diagnostics..."

            POD_STATUS=$(kubectl -n default get pods -l app=quartz-api -o wide 2>&1)
            POD_LOGS=$(kubectl -n default logs -l app=quartz-api --tail=35 --all-containers=true 2>&1)

            send_discord_alert "**Deployment FAILED for quartz-api (\`${COMMIT_SHA:0:7}\`)**" "$POD_STATUS" "$POD_LOGS"

            echo "Rolling back to previous revision..."
            kubectl -n default rollout undo deployment/quartz-api
            exit 1
          fi

          echo "Rollout successfully completed and verified."

          if [ "$DEPLOY_ALERT_ON_SUCCESS" = "1" ]; then
            echo "DEPLOY_ALERT_ON_SUCCESS is enabled (1). Sending success notification..."
            POD_STATUS=$(kubectl -n default get pods -l app=quartz-api -o wide 2>&1)
            POD_LOGS=$(kubectl -n default logs -l app=quartz-api --tail=25 --all-containers=true 2>&1)
            send_discord_alert "**Deployment SUCCEEDED for quartz-api (\`${COMMIT_SHA:0:7}\`)**" "$POD_STATUS" "$POD_LOGS"
          fi
