name: Release

on:
  push:
    tags:
      - 'v*'   # triggers on v0.1.0, v1.0.0-beta, v0.2.1-alpha, etc.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run Go Tests
        run: go test -v ./...
        working-directory: ./server

  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quartz-server
          tags: |
            # :v0.1.0 — exact git tag (including the 'v')
            type=raw,value=${{ github.ref_name }}
            # :0.1.0 — exact semver tag (without 'v')
            type=semver,pattern={{version}}
            # :v0.1 — minor alias (suppressed for pre-releases like -beta, -alpha)
            type=semver,pattern={{major}}.{{minor}}
            # :v0 — major alias (suppressed for pre-releases)
            type=semver,pattern={{major}}
            # :sha-a3f9c1b — immutable commit pin, same as CI builds
            type=sha,prefix=sha-,format=short
            # :build-142 — monotonic build number
            type=raw,value=build-${{ github.run_number }}
            # :latest — move latest forward on stable releases only (not pre-releases)
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}-sha-${{ github.sha }}-build-${{ github.run_number }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: true
