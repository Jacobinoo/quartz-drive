name: Build and Deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quartz-server
          tags: |
            # :latest — always updated on master push
            type=raw,value=latest
            # :sha-a3f9c1b — immutable commit pin for precise rollbacks
            type=sha,prefix=sha-,format=short
            # :build-142 — monotonic build number, easy to compare
            type=raw,value=build-${{ github.run_number }}

      - name: Build and push quartz-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build qdeploy
        # Pure stdlib — no CGO, cross-compiles cleanly in CI
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build \
              -ldflags="-s -w" \
              -trimpath \
              -o qdeploy \
              ./cmd/deploy
        
      - name: Copy deploy artifacts to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Only ship what the server actually needs:
          #   qdeploy              — the deploy binary
          #   docker-compose.prod.yml — the compose definition
          source: "qdeploy,docker-compose.prod.yml"
          target: "~/QuartzAccountGo/"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # command_timeout must exceed health-timeout + image pull time
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ~/QuartzAccountGo

            chmod +x qdeploy

            # Deploy the exact immutable SHA that was just built in CI.
            # metadata-action pushes short SHAs (7 chars), so we truncate here to match.
            ./qdeploy \
              -f docker-compose.prod.yml \
              -env-file .env.production \
              -service quartz-server \
              -tag sha-$(echo "${{ github.sha }}" | cut -c1-7) \
              -timeout 90s
