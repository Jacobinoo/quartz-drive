services:
  quartz-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_AUTO_MIGRATE=true
      - FRONTEND_URL=https://localhost:3000
      - DISABLE_SWEEPS=false
    env_file:
      - .env
    volumes:
      # Mount the cert directory so you can update certs without rebuilding the image
      - ./cert:/app/cert
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://127.0.0.1:3100/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      replicas: 3

  lb:
    image: nginx:latest
    ports:
      - "3100:3100"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert:/etc/nginx/cert:ro
    depends_on:
      - quartz-api
