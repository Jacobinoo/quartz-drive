name: Build and Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run Go Tests
        run: go test -v ./...
        working-directory: ./server

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quartz-server
          tags: |
            # :latest — always updated on master push
            type=raw,value=latest
            # :sha-a3f9c1b — immutable commit pin for precise rollbacks
            type=sha,prefix=sha-,format=short
            # :build-142 — monotonic build number, easy to compare
            type=raw,value=build-${{ github.run_number }}

      - name: Build and push quartz-server image
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_VERSION=sha-${{ github.sha }}-build-${{ github.run_number }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max


