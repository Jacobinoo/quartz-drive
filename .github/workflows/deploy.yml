name: Deploy API to Google Cloud

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5' # Change this if you use a different Go version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "internal/bindings/opaque_rust"

      - name: Build Go and Rust Binaries
        run: |
          make build

      - name: Copy Files to Google Cloud
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/quartz-server,internal/bindings/opaque_rust/target/release/libopaque_rust.so"
          target: "/home/${{ secrets.SERVER_USERNAME }}/deploy_temp"
          strip_components: 0

      - name: Deploy and Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Stop the currently running service
            sudo systemctl stop quartz

            # 2. Move the new files into place
            mv /home/${{ secrets.SERVER_USERNAME }}/deploy_temp/build/quartz-server /home/${{ secrets.SERVER_USERNAME }}/quartz-server
            sudo mv /home/${{ secrets.SERVER_USERNAME }}/deploy_temp/internal/bindings/opaque_rust/target/release/libopaque_rust.so /usr/lib/

            # 3. Clean up the temp folder
            rm -rf /home/${{ secrets.SERVER_USERNAME }}/deploy_temp

            # 4. Make sure it's executable
            chmod +x /home/${{ secrets.SERVER_USERNAME }}/quartz-server

            # 5. Reload the shared libraries cache
            sudo ldconfig

            # 6. Start the service
            sudo systemctl start quartz

            # 7. Check status
            sudo systemctl is-active quartz
