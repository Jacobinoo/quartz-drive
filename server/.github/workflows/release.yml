name: Release

on:
  push:
    tags:
      - 'v*'   # triggers on v0.1.0, v1.0.0-beta, v0.2.1-alpha, etc.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quartz-server
          tags: |
            # :v0.1.0 — exact git tag (including the 'v')
            type=raw,value=${{ github.ref_name }}
            # :0.1.0 — exact semver tag (without 'v')
            type=semver,pattern={{version}}
            # :v0.1 — minor alias (suppressed for pre-releases like -beta, -alpha)
            type=semver,pattern={{major}}.{{minor}}
            # :v0 — major alias (suppressed for pre-releases)
            type=semver,pattern={{major}}
            # :sha-a3f9c1b — immutable commit pin, same as CI builds
            type=sha,prefix=sha-,format=short
            # :build-142 — monotonic build number
            type=raw,value=build-${{ github.run_number }}
            # :latest — move latest forward on stable releases only (not pre-releases)
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}-sha-${{ github.sha }}-build-${{ github.run_number }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build qdeploy
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build \
              -ldflags="-s -w" \
              -trimpath \
              -o qdeploy \
              ./cmd/deploy

      - name: Copy deploy artifacts to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "qdeploy,docker-compose.prod.yml"
          target: "~/QuartzAccountGo/"

      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ~/QuartzAccountGo

            chmod +x qdeploy

            # Deploy the exact semver tag that triggered this release.
            # Using the semver tag (not :latest) guarantees reproducibility —
            # if you re-run this workflow, you get the exact same image.
            ./qdeploy \
              -f docker-compose.prod.yml \
              -env-file .env.production \
              -service quartz-server \
              -tag ${{ github.ref_name }} \
              -timeout 90s
