name: Release

on:
  push:
    tags:
      - 'v*'   # triggers on v0.1.0, v1.0.0-beta, v0.2.1-alpha, etc.

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quartz-server
          tags: |
            # :v0.1.0 — exact git tag (including the 'v')
            type=raw,value=${{ github.ref_name }}
            # :0.1.0 — exact semver tag (without 'v')
            type=semver,pattern={{version}}
            # :v0.1 — minor alias (suppressed for pre-releases like -beta, -alpha)
            type=semver,pattern={{major}}.{{minor}}
            # :v0 — major alias (suppressed for pre-releases)
            type=semver,pattern={{major}}
            # :sha-a3f9c1b — immutable commit pin, same as CI builds
            type=sha,prefix=sha-,format=short
            # :build-142 — monotonic build number
            type=raw,value=build-${{ github.run_number }}
            # :latest — move latest forward on stable releases only (not pre-releases)
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}-sha-${{ github.sha }}-build-${{ github.run_number }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          cache: true

      - name: Build qdeploy
        working-directory: server
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build \
              -ldflags="-s -w" \
              -trimpath \
              -o ../qdeploy \
              ./cmd/deploy
          
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          # Using Workload Identity Federation
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install NumPy for Fast IAP Tunneling
        run: pipx install numpy

      - name: Copy deploy artifacts to server (via IAP)
        env:
          CLOUDSDK_PYTHON_SITEPACKAGES: "1"
        run: |
          gcloud compute scp qdeploy server/docker-compose.prod.yml \
            ${{ secrets.GCP_VM_INSTANCE_NAME }}::/tmp/ \
            --zone=${{ secrets.GCP_ZONE }} \
            --tunnel-through-iap \
            --strict-host-key-checking=no

      - name: Deploy release (via IAP)
        env:
          CLOUDSDK_PYTHON_SITEPACKAGES: "1"
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_INSTANCE_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --tunnel-through-iap \
            --strict-host-key-checking=no
            --command="
              set -euo pipefail
          
              sudo mv /tmp/qdeploy /tmp/docker-compose.prod.yml /home/kuba/quartz-drive/
              sudo chown kuba:kuba /home/kuba/quartz-drive/qdeploy /home/kuba/quartz-drive/docker-compose.prod.yml
          
              sudo -u kuba bash -c '
              cd /home/kuba/quartz-drive
              chmod +x qdeploy
          
              ./qdeploy \
                -f docker-compose.prod.yml \
                -env-file .env.production \
                -service quartz-server \
                -tag ${{ github.ref_name }} \
                -timeout 90s
            "

